services:
  postgres:
    image: postgres:17
    restart: always
    volumes:
      - ./diary_ai_data:/var/lib/postgresql/data
    ports:
      - '5439:5432'
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary_service
  redis:
    image: redis:7
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
